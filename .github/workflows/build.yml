name: Build ESP32-S3
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install platformio
          pio pkg install -g -p espressif32
          pio run
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .pio/build/esp32s3/*.bin
